name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Vite 8 requiere Node >= 20.19; el Node por defecto de Oryx puede ser menor, así que se compila aquí.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api-ollas-prod-fhezb8atcxgmbrfa.eastus-01.azurewebsites.net/api' }}
          VITE_OPERATIVO_MODO: ${{ vars.VITE_OPERATIVO_MODO || 'demo' }}
          VITE_META_PCAL: ${{ vars.VITE_META_PCAL }}
          VITE_META_EINS: ${{ vars.VITE_META_EINS }}
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_GLACIER_0500CF30F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # La app ya se compiló arriba: se publica la carpeta dist tal cual (sin build de Oryx).
          app_location: "dist"
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_GLACIER_0500CF30F }}
          action: "close"
